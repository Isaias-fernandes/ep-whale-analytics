name: Transfer EP histories to isolated storage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-ep-histories.yml'
      - 'scripts/transfer_ep_histories.py'
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read
concurrency:
  group: ep-history-archive
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/archive_ep_histories.py scripts/transfer_ep_histories.py
      - name: Copy, verify and move completed lab histories
        env:
          EP_SUPABASE_ACCESS_TOKEN: ${{ secrets.EP_SUPABASE_ACCESS_TOKEN }}
          EP_ARCHIVE_TOKEN: ${{ secrets.EP_ARCHIVE_TOKEN }}
          EP_ARCHIVE_REPOSITORY: ${{ secrets.EP_ARCHIVE_REPOSITORY }}
        run: python scripts/transfer_ep_histories.py
