name: EP data quality regression
on:
  pull_request:
  push:
    paths:
      - 'app.js'
      - 'quality-panel.mjs'
      - 'tests/**'
      - '.github/workflows/quality-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node --check app.js
      - run: node --check quality-panel.mjs
